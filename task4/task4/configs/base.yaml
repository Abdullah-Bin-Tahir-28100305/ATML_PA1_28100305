

seed: 6304


known:
  name: cifar10
  root: ./data_cache        
  num_classes: 10
  
  train_frac: 0.9


unknowns:
  
  near: [bus, pickup_truck, motorcycle, tractor, wolf, fox, leopard, camel]
  far:  [bottle, bowl, chair, clock, keyboard, mushroom, sunflower, wardrobe]
  images_per_group: 800     


image:
  size: 32
  crop_padding: 4
  norm_mean: [0.4914, 0.4822, 0.4465]   # CIFAR-10 channel means
  norm_std:  [0.2470, 0.2435, 0.2616]   # CIFAR-10 channel stds


train:
  optimizer: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005      # 5e-4
  scheduler: cosine         # cosine learning-rate decay over all epochs
  batch_size: 128
  epochs: 100
  num_workers: 2


evaluation:
  tpr_target: 0.95          # aim to accept 95% of known validation examples
  
  mahalanobis_eps: 0.000001

method:
  name: vanilla

paths:
  results_dir: ./results
  checkpoints_dir: ./results/checkpoints
  cache_dir: ./cache        # saved logits/features only (spec: cache/)
  splits_file: ./results/cifar10_split_seed6304.json
