
seed: 6304


dataset:
  name: pacs
  root: ./data_cache/PACS          # where the PACS images live / are downloaded
  num_classes: 7                   # dog, elephant, giraffe, guitar, horse, house, person
  
  target_domain: sketch
  source_domains: [photo, art_painting, cartoon]


image:
  resize: 256                      # first resize the short side / whole image
  crop: 224                        # network input size (ResNet-18 expects 224)
  # ImageNet normalization stats (ResNet-18 was pretrained with these).
  norm_mean: [0.485, 0.456, 0.406]
  norm_std:  [0.229, 0.224, 0.225]


split:
  train_frac: 0.8
  val_frac: 0.2


train:
  optimizer: adamw
  lr: 0.0001                       # 1e-4
  weight_decay: 0.0001             # 1e-4
  max_epochs: 30
  early_stop_patience: 5           # epochs w/o mean source-val macro-F1 gain
  
  per_source_batch: 8              # 8 images from EACH of the 3 source domains
  target_batch: 24                 # 24 target images per update
  
  grad_clip_norm: 1.0              # clip global grad-norm to this value (0=off)


freeze_bn_running_stats: true


domain_separability:
  test_frac: 0.30                  # 70/30 train/test split of the features
  C: 1.0                           # inverse regularization strength for LogReg
  class_weight: balanced           # 'balanced' logistic regression
  max_features_per_group: 1500     # cap features per group for speed (equal #)


method:
  name: source_only                # one of: source_only | dan | dann | cdan


paths:
  results_dir: ./results
  checkpoints_dir: ./results/checkpoints
  shared_splits: ../shared/splits/pacs_sketch_seed6304.json
