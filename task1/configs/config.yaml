
seed: 6304


dataset:
  name: stl10            
  root: ./data_cache     
  num_classes: 10        


image_size: 224          


split:
  train_frac: 0.8        
  val_frac: 0.2          


train:
  max_epochs: 50         
  lr: 0.001              
  weight_decay: 0.0001   
  batch_size: 128        
  early_stop_patience: 5 
  optimizer: adamw       


eval_subset:
  size: 500              
  balanced: true         


cue_conflict:
  num_pairs: 6           
  target_valid: 220      
  style_strength: 1.0    
                         
                         
  n_saved_samples: 40    
        
  reject:
    min_std: 0.03        
    min_change: 0.02     


translation:
  shifts: [0, 8, 16, 32]                 
  directions: [up, down, left, right]    


patch_shuffle:
  grid: 4                


color:
  additional: hue_rotation   
  hue_degrees: 90            


visualization:
  method: tsne           
  perplexity: 30         
  n_iter: 1000           
  umap_n_neighbors: 15   
  umap_min_dist: 0.1     


clip:
  model_name: ViT-B-32   
  pretrained: openai     
  prompt_template: "a photo of a {}."   


paths:
  results_dir: ./results     
  cache_dir: ./cache         
